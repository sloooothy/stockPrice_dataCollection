name: Notice News fetching Sync

on:
  schedule:
    - cron: '0 9 * * 1-5' # 台灣時間每週一至週五下午 5:00 執行
  workflow_dispatch:      # 允許手動觸發測試

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: checkout 
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行程式
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python stockData_retrieve/fetch_notice.py -yy 115 -mm 11 -dd 5 #testing