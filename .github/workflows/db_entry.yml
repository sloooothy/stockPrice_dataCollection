name: Notice News fetching Sync

on:
  schedule:
    - cron: '0 12 * * 1-5' # 台灣時間每週一至週五晚上 8:00 執行
  workflow_dispatch:      # 允許手動觸發測試

jobs:
  run:
    runs-on: ubuntu-latest
    
    # 共用的環境變數
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      DB_NAME: ${{ secrets.DB_NAME }}
      NOTICE_COLLECTION: ${{ secrets.NOTICE_COLLECTION }}
      
    steps:
      - name: checkout 
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行data抓取程式
        # 這裡不需要寫 env，會自動沿用 Job 層級的共用變數
        run: python stockData_retrieve/fetch_notice.py

      - name: 執行 dicord 發送程式
        env:
          # 這裡保留這支程式獨有的 secret（會與 Job 層級的共用變數合併）
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python stockData_retrieve/inform_discord.py