name: Daily Data Sync

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0:00 執行一次（維持活躍並更新資料）
  workflow_dispatch:     # 允許手動觸發測試

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: checkout 
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝套件
        run: pip install pymongo requests

      - name: 執行程式
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python stockData_retrieve/test.py