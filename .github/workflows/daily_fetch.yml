name: Daily Stock Data Fetcher

# 設定排程：每天 UTC 時間 9 點執行 (大約是台灣時間下午 5 點)。
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write # 賦予 GITHUB_TOKEN 寫入 (commit/push) 倉庫內容的權限

jobs:
  fetch_and_commit:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install Dependencies
        run: pip install -r requirements.txt

      - name: 4. Execute Python Script (Fetch Data & Debug)
        run: |
          echo "Starting Python script execution..."
          python stockData_retrieve/main.py
          echo "--- File Status Check ---"
          # 偵錯：確認 json 資料夾的檔案生成狀況
          ls -la stockData/json/ || true

      - name: 4.5 Stage Files Manually
        run: |
          git add stockData/json/
          git status

      - name: 5. Auto Commit Updated JSON Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat: 自動新增每日股價 JSON 資料檔 (GitHub Actions)"
          # 比對 json 資料夾下的產出檔案
          file_pattern: |
            stockData/json/stock_daily_*.json
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'