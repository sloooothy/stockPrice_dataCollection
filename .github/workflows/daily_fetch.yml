name: Daily Stock Data Fetcher

on:
  #schedule: # 改外部觸發排程
    # 原本 UTC 09:00（台灣 17:00） -> 改為 UTC 09:17（台灣 17:19）
    #- cron: '19 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch_and_commit:
    runs-on: ubuntu-latest
    # 共用的環境變數
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DAILY_COLLECTION: ${{ secrets.DAILY_COLLECTION }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Install Dependencies
        run: pip install -r requirements.txt

      - name: 4. Execute Python Script (Fetch Data & Debug)
        run: |
          echo "Starting Python script execution..."
          python stockData_retrieve/fetch_daily.py

      - name: 4.5 Stage Files Manually
        run: |
          echo "--- File Status Check ---"
          ls -la stockData/json/ || true
          git add stockData/json/
          git status

      - name: 5. Auto Commit Updated JSON Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat: 自動新增每日股價 JSON 資料檔 (GitHub Actions)"
          file_pattern: |
            stockData/json/${{ env.DAILY_COLLECTION }}*.json
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'