name: Daily Stock Data Fetcher

# 設定排程：每天 UTC 時間 9 點執行 (大約是台灣時間下午 5 點)。
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

#permissions:
#  contents: write # 賦予 GITHUB_TOKEN 寫入 (commit/push) 倉庫內容的權限

jobs:
  fetch_and_commit:
    runs-on: ubuntu-latest
    # 共用的環境變數
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DAILY_COLLECTION: ${{ secrets.DAILY_COLLECTION }}
      
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Install Dependencies
        run: pip install -r requirements.txt

      - name: 4. Execute Python Script (Fetch Data & Debug)
        run: |
          echo "Starting Python script execution..."
          python stockData_retrieve/fetch_daily.py

